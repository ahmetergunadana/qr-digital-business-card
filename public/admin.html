<!DOCTYPE html>
<html lang="tr">
  <head>
        <meta charset="UTF-8">
        <title>Admin Paneli</title>
      <style>
                body { font-family: sans-serif; padding: 50px; background: #f0f0f0; }
                .login-box { background: white; padding: 20px; border-radius: 8px; max-width: 300px; margin: auto; }
                input { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
                button { width: 100%; padding: 10px; background: #4F46E5; color: white; border: none; cursor: pointer; }
            </style>
  </head>
  <body>
        <div class="login-box">
                  <h2>Admin Girisi</h2>
                <input type="text" id="adminUsername" placeholder="Kullanici Adi">
                <input type="password" id="adminPassword" placeholder="Sifre">
                <button onclick="login()">Giris Yap</button>button>
        </div>div>
      <script>
                async function login() {
                              const user = document.getElementById('adminUsername').value;
                              const pass = document.getElementById('adminPassword').value;
                              const res = await fetch('/api/admin/analitik', {
                                                headers: { 'x-admin-user': user, 'x-admin-pass': pass, 'Bypass-Tunnel-Reminder': 'true' }
                              });
                              if (res.ok) {
                                                alert('Giris basarili! Yonetim paneli yetkisi onaylandi.');
                                                // Here we would normally load the full UI. 
                                                // For now, this confirms the fix works.
                              } else {
                                                alert('Hatali kullanici adi veya sifre!');
                              }
                }
      </script>
  </body>
</html>html>
