<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş / Kayıt - Dijital Kartvizit</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .auth-container {
            background-color: var(--card-bg);
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            overflow: hidden;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
        }

        .tab {
            flex: 1;
            padding: 1.25rem;
            text-align: center;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            background-color: #f9fafb;
            transition: all 0.2s;
        }

        .tab.active {
            color: var(--primary);
            background-color: white;
            border-bottom: 2px solid var(--primary);
        }

        .form-container {
            padding: 2rem;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .form-container.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #4338ca;
        }

        .error-message {
            color: var(--danger);
            font-size: 0.875rem;
            margin-bottom: 1rem;
            text-align: center;
            display: none;
        }

        .header-logo {
            text-align: center;
            padding: 2rem 2rem 0;
        }

        .header-logo h1 {
            font-size: 1.75rem;
            background: linear-gradient(135deg, #4F46E5, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="header-logo">
            <h1>Dijital Kartvizit</h1>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem;">Sisteme giriş yapın veya kayıt olun</p>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">Giriş Yap</div>
            <div class="tab" onclick="switchTab('register')">Kayıt Ol</div>
        </div>

        <!-- Login Form -->
        <div class="form-container active" id="loginForm">
            <div class="error-message" id="loginError"></div>
            <div class="form-group">
                <label>Kullanıcı Adı</label>
                <input type="text" id="loginUser" placeholder="Kullanıcı adınız">
            </div>
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" id="loginPass" placeholder="Şifreniz">
            </div>
            <button class="btn" onclick="login()">Giriş Yap</button>
        </div>

        <!-- Register Form -->
        <div class="form-container" id="registerForm">
            <div class="error-message" id="registerError"></div>
            <div class="form-group">
                <label>Kullanıcı Adı</label>
                <input type="text" id="regUser" placeholder="Kullanıcı adı belirleyin">
            </div>
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" id="regPass" placeholder="Şifre belirleyin">
            </div>
            <button class="btn" onclick="register()">Kayıt Ol</button>
        </div>
    </div>

    <script>
        // Check if already logged in
        if (localStorage.getItem('token')) {
            window.location.href = '/dashboard.html';
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-container').forEach(f => f.classList.remove('active'));
            
            if (tab === 'login') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        }

        async function login() {
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;
            const errDiv = document.getElementById('loginError');

            if (!user || !pass) {
                errDiv.textContent = 'Lütfen tüm alanları doldurun';
                errDiv.style.display = 'block';
                return;
            }

            try {
                const res = await fetch('/api/auth/giris', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Bypass-Tunnel-Reminder': 'true'
                    },
                    body: JSON.stringify({ username: user, password: pass })
                });
                
                const data = await res.json();
                
                if (!res.ok) throw new Error(data.error);

                localStorage.setItem('token', data.token);
                localStorage.setItem('username', data.username);
                window.location.href = '/dashboard.html';

            } catch (err) {
                errDiv.textContent = err.message;
                errDiv.style.display = 'block';
            }
        }

        async function register() {
            const user = document.getElementById('regUser').value;
            const pass = document.getElementById('regPass').value;
            const errDiv = document.getElementById('registerError');

            if (!user || !pass) {
                errDiv.textContent = 'Lütfen tüm alanları doldurun';
                errDiv.style.display = 'block';
                return;
            }

            try {
                const res = await fetch('/api/auth/kayit', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Bypass-Tunnel-Reminder': 'true'
                    },
                    body: JSON.stringify({ username: user, password: pass })
                });
                
                const data = await res.json();
                
                if (!res.ok) throw new Error(data.error);

                alert('Kayıt başarılı! Şimdi giriş yapabilirsiniz.');
                switchTab('login');
                document.getElementById('loginUser').value = user;
                document.getElementById('loginPass').value = '';

            } catch (err) {
                errDiv.textContent = err.message;
                errDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
