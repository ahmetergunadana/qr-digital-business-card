<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kullanıcı Paneli - Dijital Kartvizit</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4F46E5;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body { background-color: var(--bg-color); color: var(--text-main); }

        header {
            background-color: white; border-bottom: 1px solid var(--border);
            padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center;
        }

        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }

        .btn {
            background-color: var(--primary); color: white; border: none; padding: 0.75rem 1.5rem;
            border-radius: 0.5rem; cursor: pointer; font-weight: 500; transition: 0.2s;
        }
        .btn:hover { background-color: #4338ca; }
        .btn-outline { background-color: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-danger { background-color: var(--danger); }

        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; margin-top: 1.5rem; }

        .card-item {
            background: white; border-radius: 1rem; padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); display: flex; flex-direction: column;
        }
        .card-item h3 { margin-bottom: 0.5rem; }
        .card-item p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem; flex-grow: 1; }
        .card-actions { display: flex; gap: 0.5rem; }

        /* Form Modal */
        .modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: flex-start;
            overflow-y: auto; padding: 2rem 1rem; z-index: 50;
        }
        .modal.active { display: flex; }

        .modal-content {
            background: white; padding: 2rem; border-radius: 1rem; width: 100%; max-width: 800px;
            position: relative; animation: slideDown 0.3s ease;
        }
        @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .close-btn { position: absolute; top: 1.5rem; right: 1.5rem; background: none; border: none; font-size: 1.5rem; cursor: pointer; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
        
        .form-group { display: flex; flex-direction: column; gap: 0.25rem; }
        .form-group.full { grid-column: 1 / -1; }
        label { font-size: 0.85rem; font-weight: 500; }
        input, textarea { padding: 0.75rem; border: 1px solid var(--border); border-radius: 0.5rem; outline: none; }
        input:focus, textarea:focus { border-color: var(--primary); }

        .section-title { grid-column: 1 / -1; font-size: 1.1rem; font-weight: 600; margin-top: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }

        .custom-field-row { display: flex; gap: 1rem; margin-bottom: 0.5rem; }
        .custom-field-row input { flex: 1; }
        .remove-field-btn { background: var(--danger); color: white; border: none; border-radius: 0.5rem; width: 40px; cursor: pointer; }

        .color-picker { display: flex; gap: 0.5rem; }
        .color-option { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .color-option.selected { border-color: #000; transform: scale(1.1); }
    </style>
</head>
<body>

    <header>
        <h2><i class="fa-solid fa-address-card" style="color: var(--primary);"></i> Dijital Kartvizit</h2>
        <div>
            <span id="welcomeText" style="margin-right: 1rem; font-weight: 500;"></span>
            <button class="btn btn-outline" onclick="logout()">Çıkış Yap</button>
        </div>
    </header>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Kartvizitlerim</h2>
            <button class="btn" onclick="openModal('createModal')"><i class="fa-solid fa-plus"></i> Yeni Kart Oluştur</button>
        </div>

        <div class="cards-grid" id="cardsGrid">
            Yükleniyor...
        </div>
    </div>

    <!-- Create Card Modal -->
    <div class="modal" id="createModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('createModal')">&times;</button>
            <h2 style="margin-bottom: 1.5rem;">Yeni Kartvizit Oluştur</h2>
            
            <form id="cardForm" class="form-grid">
                <div class="section-title">Kişisel Bilgiler</div>
                <div class="form-group"><label>Ad *</label><input type="text" name="ad" required></div>
                <div class="form-group"><label>Soyad *</label><input type="text" name="soyad" required></div>
                <div class="form-group"><label>Unvan</label><input type="text" name="unvan"></div>
                <div class="form-group"><label>Şirket</label><input type="text" name="sirket"></div>

                <div class="section-title">İletişim Bilgileri</div>
                <div class="form-group"><label>Telefon</label><input type="tel" name="tel"></div>
                <div class="form-group"><label>E-posta</label><input type="email" name="email"></div>
                <div class="form-group"><label>Web Sitesi</label><input type="url" name="web"></div>
                <div class="form-group"><label>Şehir</label><input type="text" name="sehir"></div>

                <div class="section-title">Sosyal Medya</div>
                <div class="form-group"><label>LinkedIn URL</label><input type="url" name="linkedin"></div>
                <div class="form-group"><label>Instagram URL</label><input type="url" name="instagram"></div>
                <div class="form-group"><label>Twitter URL</label><input type="url" name="twitter"></div>
                <div class="form-group"><label>WhatsApp (Rakam)</label><input type="text" name="whatsapp"></div>

                <div class="section-title">
                    Özel Alanlar (İsteğe Bağlı)
                    <button type="button" class="btn btn-outline" style="padding: 0.2rem 0.5rem; float: right; font-size: 0.8rem;" onclick="addCustomField()">+ Satır Ekle</button>
                </div>
                <div class="form-group full" id="customFieldsContainer">
                    <!-- Dinamik alanlar buraya -->
                </div>

                <div class="section-title">Detaylar</div>
                <div class="form-group full">
                    <label>Biyografi</label>
                    <textarea name="bio" rows="3"></textarea>
                </div>

                <div class="form-group full">
                    <label>Tema Rengi</label>
                    <div class="color-picker">
                        <div class="color-option selected" style="background-color: #4F46E5;" data-color="#4F46E5"></div>
                        <div class="color-option" style="background-color: #ec4899;" data-color="#ec4899"></div>
                        <div class="color-option" style="background-color: #10b981;" data-color="#10b981"></div>
                        <div class="color-option" style="background-color: #f59e0b;" data-color="#f59e0b"></div>
                        <div class="color-option" style="background-color: #1f2937;" data-color="#1f2937"></div>
                    </div>
                    <input type="hidden" id="renk" name="renk" value="#4F46E5">
                </div>

                <div class="form-group full" style="margin-top: 1rem;">
                    <button type="submit" class="btn" style="width: 100%;">Kartviziti Oluştur</button>
                </div>
            </form>
        </div>
    </div>

    <!-- QR Modal -->
    <div class="modal" id="qrModal">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <button class="close-btn" onclick="closeModal('qrModal'); loadCards()">&times;</button>
            <h2>Kartınız Hazır!</h2>
            <img id="qrImage" src="" style="width: 250px; margin: 1.5rem auto; display: block; border: 1px solid var(--border); border-radius: 0.5rem; padding: 1rem;">
            <a href="#" id="viewCardLink" target="_blank" class="btn" style="display: block; text-decoration: none;">Kartı Görüntüle</a>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username');

        if (!token) {
            window.location.href = '/';
        }

        document.getElementById('welcomeText').textContent = `Hoşgeldin, ${username}`;

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            window.location.href = '/';
        }

        async function fetchAPI(url, options = {}) {
            options.headers = {
                ...options.headers,
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json',
                'Bypass-Tunnel-Reminder': 'true'
            };
            const res = await fetch(url, options);
            if (res.status === 401) logout();
            return res;
        }

        async function loadCards() {
            const res = await fetchAPI('/api/benim-kartlarim');
            if (!res.ok) return;
            const cards = await res.json();
            
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            if (cards.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 3rem;">Henüz bir kartvizitiniz yok.</p>';
                return;
            }

            cards.forEach(card => {
                grid.innerHTML += `
                    <div class="card-item">
                        <h3>${card.ad} ${card.soyad}</h3>
                        <p>${card.unvan || ''} - ${card.sirket || ''}</p>
                        <p style="font-size:0.8rem; margin-bottom: 0.5rem;">Oluşturulma: ${new Date(card.olusturulma).toLocaleDateString()}</p>
                        <div class="card-actions">
                            <a href="/kart.html?id=${card.id}" target="_blank" class="btn" style="flex:1; text-align:center; text-decoration:none; padding: 0.5rem;">Görüntüle</a>
                        </div>
                    </div>
                `;
            });
        }

        // Modals
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        // Color picker
        document.querySelectorAll('.color-option').forEach(opt => {
            opt.addEventListener('click', () => {
                document.querySelectorAll('.color-option').forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
                document.getElementById('renk').value = opt.dataset.color;
            });
        });

        // Custom Fields
        let customFieldCount = 0;
        function addCustomField() {
            const container = document.getElementById('customFieldsContainer');
            const id = `cf_${customFieldCount++}`;
            const row = document.createElement('div');
            row.className = 'custom-field-row';
            row.id = id;
            row.innerHTML = `
                <input type="text" placeholder="Başlık (Örn: Skype)" class="cf-label" required>
                <input type="text" placeholder="Değer (Örn: skype.id)" class="cf-value" required>
                <button type="button" class="remove-field-btn" onclick="document.getElementById('${id}').remove()">X</button>
            `;
            container.appendChild(row);
        }

        // Form Submit
        document.getElementById('cardForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            // Extract custom fields
            const customFields = [];
            document.querySelectorAll('.custom-field-row').forEach(row => {
                const label = row.querySelector('.cf-label').value;
                const value = row.querySelector('.cf-value').value;
                if (label && value) customFields.push({ label, value });
            });
            data.ozelAlanlar = customFields;

            try {
                const res = await fetchAPI('/api/kart', {
                    method: 'POST',
                    body: JSON.stringify(data)
                });
                
                if (!res.ok) throw new Error('Bir hata oluştu');
                const result = await res.json();
                
                closeModal('createModal');
                document.getElementById('qrImage').src = result.qrCode;
                document.getElementById('viewCardLink').href = result.url;
                openModal('qrModal');
                e.target.reset();
                document.getElementById('customFieldsContainer').innerHTML = '';

            } catch (err) {
                alert(err.message);
            }
        });

        // Init
        loadCards();
    </script>
</body>
</html>
